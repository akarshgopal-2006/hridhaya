name: hridhaya_flutter
description: Hridhaya frontend prototype (Safety Loop, Stethoscope, Bystander, Dashboard, Settings).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: any
  sensors_plus: any
  shared_preferences: ^2.5.4
  vibration: any
  http: ^1.6.0
  socket_io_client: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/hridhaya_logo.png
